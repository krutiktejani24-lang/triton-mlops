services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=0"]
    ports:
      - "8000:8000"   # REST / HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Prometheus metrics
    volumes:
      - ./model_repository:/models:ro
    shm_size: "1g"
    restart: unless-stopped

  dashboard:
    build: ./app
    ports:
      - "5006:5006"
    environment:
      TRITON_HTTP_URL: triton:8000
      TRITON_GRPC_URL: triton:8001
      MODEL_REPO: /models
    volumes:
      - ./model_repository:/models:ro
    depends_on:
      - triton
    restart: unless-stopped
